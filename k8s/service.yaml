apiVersion: v1
kind: Service
metadata:
  name: llm-deploy
  labels:
    app: llm-deploy
spec:
  type: NodePort
  # Selects BOTH stable (version: stable) and canary (version: canary) pods
  # Traffic splits proportionally to replica counts
  selector:
    app: llm-deploy
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    nodePort: 30080
